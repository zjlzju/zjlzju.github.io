{{ define "main" }}
  <article class="post-single">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time>{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.categories }}<span class="meta-sep">·</span><span>{{ index . 0 }}</span>{{ end }}
    </div>
    {{ with .Params.tags }}<div class="tags">{{ range . }}<span class="tag">#{{ . }}</span>{{ end }}</div>{{ end }}
    <div class="post-content">{{ .Content }}</div>
    <div class="post-back"><a href="{{ "/posts/" | relURL }}">← 返回文章列表</a></div>
  </article>
{{ end }}
