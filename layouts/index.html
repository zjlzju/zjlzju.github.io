{{ define "main" }}
  <div class="section-title">最新文章</div>
  <ul class="posts">
    {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
    <li>
      <a class="post-link" href="{{ .RelPermalink }}">
        <time class="date">{{ .Date.Format "2006-01-02" }}</time>
        <span class="title">{{ .Title }}</span>
      </a>
    </li>
    {{ else }}
    <li><span class="placeholder">第一篇文章，正在路上……</span></li>
    {{ end }}
  </ul>

  <div class="section-title">友情链接</div>
  <div class="links">
    {{ range .Site.Params.links }}
    <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
    {{ end }}
  </div>
{{ end }}
