{{ define "main" }}
  <div class="section-title page-title">{{ .Title }}</div>
  {{ with .Content }}<div class="page-desc">{{ . }}</div>{{ end }}
  <ul class="posts">
    {{ range .Pages }}
    <li>
      <a class="post-link" href="{{ .RelPermalink }}">
        <time class="date">{{ .Date.Format "2006-01-02" }}</time>
        <span class="title">{{ .Title }}</span>
      </a>
      {{ with .Params.tags }}<div class="tags">{{ range . }}<span class="tag">#{{ . }}</span>{{ end }}</div>{{ end }}
    </li>
    {{ else }}
    <li><span class="placeholder">这里还没有内容。</span></li>
    {{ end }}
  </ul>
{{ end }}
