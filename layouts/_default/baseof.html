<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ now.Unix }}">
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <img class="logo" src="{{ "Ryoma.jpg" | relURL }}" alt="Ryoma">
    <h1><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
    <div class="sub">{{ .Site.Params.description }}</div>
    <nav class="nav">
      <a href="{{ "/" | relURL }}">首页</a>
      <a href="{{ "/posts/" | relURL }}">文章</a>
      <a href="{{ "/categories/" | relURL }}">分类</a>
      <a href="{{ "/tags/" | relURL }}">标签</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>© 2026 {{ .Site.Params.author }} · Built with Hugo + GitHub Pages</footer>
</div>
</body>
</html>
